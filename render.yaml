# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo. Creates the Postgres database and
# one web service that serves the API, the live-session WebSocket and the React app.

databases:
  - name: interviewlens-db
    databaseName: interviewlens
    user: interviewlens
    plan: free            # free Postgres expires after 30 days — use basic-256mb for anything real
    region: singapore

services:
  - type: web
    name: interviewlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # free instances sleep after 15 min idle — use starter for live interviews
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interviewlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      # FRONTEND_URL and OAUTH_REDIRECT_URI default to RENDER_EXTERNAL_URL
      # (set by Render), e.g. https://interviewlens.onrender.com/api/auth/oauth/callback

      # ── Google / GitHub sign-in (optional) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # ── Candidate invite emails (optional; without SMTP_HOST invites aren't delivered) ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
